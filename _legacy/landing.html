<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Margot — the magpie who reads your closet</title>
<meta name="description" content="Daily outfit suggestions from what you already own. Join the waitlist for early access." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,30..100;1,9..144,300..600,30..100&family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #ECEAE5; font-family: 'Inter Tight', sans-serif; color: #2D3A33; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  ::selection { background: #2D3A33; color: #F6F4EF; }
  html { scroll-behavior: smooth; }
  a:hover { opacity: 0.7; }

  /* Mobile: collapse all 2-col grids to 1 col + recenter mascot.
     We size by clamp() above so most things already adapt; this
     just handles the structural stacking. */
  @media (max-width: 760px) {
    .hero-grid, .meet-grid, .second-grid {
      grid-template-columns: minmax(0, 1fr) !important;
    }
    .hero-grid > div:last-child,
    .meet-grid > div:first-child {
      order: -1;
    }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="system.jsx"></script>
<script type="text/babel" src="margot.jsx"></script>
<script type="text/babel" src="landing-a.jsx"></script>
<script type="text/babel" src="landing-b.jsx"></script>
<script type="text/babel" src="landing-c.jsx"></script>

<script type="text/babel">
function App() {
  const [lang, setLang] = React.useState('en');
  const [submitted, setSubmitted] = React.useState(false);
  const [email, setEmail] = React.useState('');
  const t = LANDING_CONTENT[lang];

  return (
    <div>
      <LandingHeader lang={lang} setLang={setLang} />
      <Hero t={t} submitted={submitted} setSubmitted={setSubmitted} email={email} setEmail={setEmail} />
      <FadeIn><Problem t={t} /></FadeIn>
      <FadeIn><Features t={t} /></FadeIn>
      <FadeIn><MeetMargot t={t} /></FadeIn>
      <FadeIn><Pricing t={t} /></FadeIn>
      <FadeIn><SecondCapture t={t} submitted={submitted} setSubmitted={setSubmitted} email={email} setEmail={setEmail} /></FadeIn>
      <FadeIn><Faq t={t} /></FadeIn>
      <Footer t={t} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
